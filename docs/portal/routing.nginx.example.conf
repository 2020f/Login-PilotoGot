# upstream crm_operativo { server 127.0.0.1:5000; }
# upstream portal_api { server 127.0.0.1:5031; }
# upstream portal_react { server 127.0.0.1:3000; }
#
# Todos los proxy_pass necesitan el bloque equivalente:
# proxy_set_header Host $host;
# proxy_set_header X-Forwarded-Proto $scheme;
# proxy_set_header X-Forwarded-For $remote_addr;
# proxy_redirect off;
# No confiar en X-Forwarded-Proto suministrado por el cliente. Si hay otro salto
# TLS delante, usar únicamente la configuración saneada para ese proxy exacto.
# No añadir Domain a Set-Cookie ni ocultar Secure/HttpOnly.

